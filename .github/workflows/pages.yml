name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "build_web.py", "build_seo.py", "indexnow.py", "deck_order.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Own domain: set to e.g. https://example.com.ua/ (also writes CNAME).
  SITE_URL: https://zdaipdr.com.ua/
  # How many explained question pages are live; raise it every week or two (0 = all).
  SEO_MAX_EXPLAINED: "200"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_web.py data _site
      # The sitemap that is live now, to tell search engines only what changed.
      - run: curl -fsS "${SITE_URL}sitemap.xml" -o old_sitemap.xml || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow checks the key file on the live site: give the CDN a minute to serve the new build.
      - run: sleep 60 && python indexnow.py old_sitemap.xml _site/sitemap.xml
